<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Açaí & Cia – Cardápio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FBF6FD;--surface:#fff;--text:#2A0630;--muted:#6E5776;--line:#E8D9EF;
  --brand:#33003A;--accent:#9B3FB8;--accent-ink:#fff;--lilac:#D68BE6;--leaf:#8DC63F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#220028;--surface:#2E0636;--text:#F6EAF9;--muted:#BFA3C8;--line:#46164F;
    --accent:#C77DDC;--accent-ink:#2A0630;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#220028;--surface:#2E0636;--text:#F6EAF9;--muted:#BFA3C8;--line:#46164F;
  --accent:#C77DDC;--accent-ink:#2A0630;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Nunito,system-ui,sans-serif;padding-bottom:96px}
.top{background:#35013A;text-align:center;padding:env(safe-area-inset-top,0px) 0 0;line-height:0}
.logo{display:block;width:min(100%,380px);height:auto;margin:0 auto}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:14px;background:var(--surface)}
.chips a:focus-visible,.btn:focus-visible,.wa:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:8px 16px}
section{padding-top:22px}
h2{font:400 26px/1.2 Pacifico,cursive;margin:0;color:var(--accent)}
.sub{margin:2px 0 6px;color:var(--muted);font-size:14px}
.item{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 14px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color .15s,box-shadow .15s}
.item h3{margin:0;font-size:17px;font-weight:800}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.mi{display:flex;gap:12px;align-items:center;min-width:0}
.ph{flex:none;width:84px;height:84px;object-fit:cover;border-radius:14px;background:var(--line)}
.buy{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-weight:800;color:var(--accent);font-size:17px}
main section:last-of-type{min-height:calc(100vh - 140px)}
.ctl{display:flex;align-items:center;gap:10px}
.btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:800 20px/1 Nunito,sans-serif;cursor:pointer}
.btn.minus{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.qty{min-width:16px;text-align:center;font-weight:800}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;transform:translateY(110%);transition:transform .25s}
.bar.on{transform:none}
.bar b{display:block;font-size:18px}
.bar span{font-size:13px;color:var(--lilac)}
.wa{background:var(--leaf);color:#1d2b05;font-weight:800;text-decoration:none;padding:12px 18px;border-radius:999px}
footer{max-width:640px;margin:24px auto 0;padding:0 16px;color:var(--muted);font-size:13px;text-align:center}
.extras{width:calc(100% - 32px);max-width:608px;margin:28px auto 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.extras[hidden]{display:none}
.extras h2{font-size:22px;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);font:600 16px Nunito,sans-serif;cursor:pointer;text-align:left}
.tog::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--accent)}
.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tog[aria-pressed="true"]::before{background:var(--accent-ink);border-color:var(--accent-ink)}
.obs{display:block;margin-top:16px;font-weight:800}
.extras textarea,.extras input{width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:400 16px/1.4 Nunito,sans-serif}
.extras textarea{min-height:84px;resize:vertical}
.tog:focus-visible,.extras textarea:focus-visible,.extras input:focus-visible,.seg:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{padding:11px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);font:800 16px Nunito,sans-serif;cursor:pointer}
.seg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
#addr[hidden]{display:none}
#addr label{display:block;margin-top:12px;font-weight:800;font-size:14px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px}
.cepbox{display:flex;gap:8px;align-items:flex-end}
.cepbox>div{flex:1}
.link{flex:none;margin-bottom:2px;padding:0 0 12px;background:none;border:0;color:var(--accent);font:600 13px Nunito,sans-serif;text-decoration:underline;cursor:pointer}
.hint.err{color:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hint.err{color:#FF8A80}}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,0,26,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h3{margin:0;font-size:20px;font-weight:800}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.opt input{width:22px;height:22px;accent-color:var(--accent)}
.hint{min-height:20px;margin:8px 0 0;color:var(--accent);font-size:14px;font-weight:600}
.act{display:flex;gap:10px;margin-top:8px}
.act button{flex:1;padding:13px;border-radius:999px;font:800 16px Nunito,sans-serif;cursor:pointer}
.act .ok{background:var(--accent);color:var(--accent-ink);border:0}
.act .cancel{background:transparent;color:var(--text);border:2px solid var(--line)}
.act button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar{transition:none}html{scroll-behavior:auto}}

/* Celular */
img{max-width:100%}
@media (max-width:420px){
  main{padding:8px 12px}
  .item{padding:10px 12px;gap:10px}
  .item h3{font-size:16px}
  .item p{font-size:13px}
  .ph{width:64px;height:64px}
  .mi{gap:10px}
  .row{grid-template-columns:96px 1fr}
  .bar b{font-size:17px}
  .wa{padding:12px 16px;font-size:15px}
  h2{font-size:24px}
}
@media (max-width:340px){.ph{display:none}}

/* Hover e categoria ativa */
.chips a,.btn,.wa,.seg,.tog,.link,.act button{transition:background .15s,color .15s,border-color .15s,transform .1s}
.chips a.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:active,.wa:active,.seg:active,.act button:active,.chips a:active{transform:scale(.95)}
@media (hover:hover){
  .chips a:hover{border-color:var(--accent);color:var(--accent)}
  .chips a.on:hover{color:var(--accent-ink)}
  .btn:hover{filter:brightness(1.15);transform:scale(1.08)}
  .btn.minus:hover{background:var(--accent);color:var(--accent-ink)}
  .wa:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .seg:hover,.tog:hover{border-color:var(--accent)}
  .item:hover{border-color:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 18%,transparent)}
  .opt:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .link:hover{color:var(--text)}
  .act .cancel:hover{border-color:var(--accent)}
  .act .ok:hover{filter:brightness(1.12)}
}
</style>
</head>

const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const normRua = t => norm(t).replace(/^av\.?\s/,"avenida ").replace(/^r\.?\s/,"rua ");

}

function feeNow(){
  const z = zoneOf(); if(!z) return null;

function geo(rua,bairro){
  const base = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&";
  const city = "&city="+encodeURIComponent("São Roque")+"&state="+encodeURIComponent("São Paulo");
  const q = p => fetch(base+p,{signal:tmo(4000)}).then(r=>r.json()).then(r=>{
    if(!r.length) throw 0; return {lat:+r[0].lat, lon:+r[0].lon};
  });
  // as duas buscas rodam juntas; vale a primeira que achar
  return Promise.any([
    q("street="+encodeURIComponent(rua)+city),
    q("q="+encodeURIComponent(rua+", "+bairro+", São Roque, SP"))
  ]);
}
async function getShop(){
  if(shopPos) return shopPos;
  if(SHOP.lat) return shopPos = {lat:SHOP.lat, lon:SHOP.lon};
  try{ const c = JSON.parse(localStorage.getItem("acai_shop")||"null"); if(c) return shopPos = c; }catch(e){}
  const d = await (await fetch("https://viacep.com.br/ws/"+SHOP.cep+"/json/",{signal:tmo(4000)})).json();
  shopPos = await geo(d.logradouro, d.bairro);
  try{ localStorage.setItem("acai_shop", JSON.stringify(shopPos)); }catch(e){}
  return shopPos;
}
function km(a,b){
  const t=x=>x*Math.PI/180, dl=t(b.lat-a.lat), dn=t(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;
  return 12742*Math.asin(Math.sqrt(h));
}
function scheduleCalc(){
  clearTimeout(calcTimer);
  const z = zoneOf(), k = addrKey();
  if(!z || !z.resto || !k || k in feeCache) return;
  const [rua,bairro] = [val("rua"),val("bairro")];
  calcTimer = setTimeout(async ()=>{
    let fee = FEE_FALLBACK;
    try{
      const [a,b] = await Promise.all([getShop(), geo(rua,bairro)]);
      fee = Math.ceil((FEE_BASE + FEE_KM*km(a,b)*ROUTE_FACTOR)*2)/2;
    }catch(e){}
    feeCache[k] = fee;
    try{ localStorage.setItem("acai_fee", JSON.stringify(feeCache)); }catch(e){}
    update();
  }, 300);
}
getShop().catch(()=>{}); // aquece a posição da loja ao abrir a página

function showFee(){
  const el = $("fee");
  el.classList.remove("err");
  if(val("cep").replace(/\D/g,"").length!==8 || !val("cidade")){ el.textContent = ""; return; }
  const f = feeNow();
  if(f===null){ el.textContent = "Entregamos apenas em São Roque."; el.classList.add("err"); }
  else if(f===undefined) el.textContent = val("rua") ? "Calculando taxa de entrega…" : "Informe a rua para calcular a taxa de entrega.";
  else el.textContent = f===0 ? "Entrega grátis!" : "Taxa de entrega: " + money(f);
}
function saveAddr(){
  try{ localStorage.setItem("acai_addr", JSON.stringify(Object.fromEntries(FIELDS.map(i=>[i,$(i).value])))); }catch(e){}
}
function loadAddr(){
  try{
    const d = JSON.parse(localStorage.getItem("acai_addr")||"null");
    if(d) FIELDS.forEach(i=>{ if(typeof d[i]==="string") $(i).value = d[i]; });
  }catch(e){}
}
async function lookupCep(cep){
  const h = $("cephint");
  h.textContent = "Buscando endereço…";
  try{
    const r = await fetch("https://viacep.com.br/ws/"+cep+"/json/");
    const d = await r.json();
    if($("cep").value.replace(/\D/g,"") !== cep) return; // CEP mudou durante a busca
    if(d.erro) throw new Error("nf");
    if(d.logradouro) $("rua").value = d.logradouro;
    if(d.bairro) $("bairro").value = d.bairro;
    $("cidade").value = d.localidade + " / " + d.uf;
    h.textContent = "Endereço encontrado. Confira e informe o número.";
    $("num").focus();
  }catch(e){
    if($("cep").value.replace(/\D/g,"") !== cep) return;
    h.textContent = "Não conseguimos buscar esse CEP. Preencha o endereço abaixo.";
  }
  saveAddr(); update(); scheduleCalc();
}
$("cep").addEventListener("input", ()=>{
  const v = $("cep").value.replace(/\D/g,"").slice(0,8);
  $("cep").value = v.length>5 ? v.slice(0,5)+"-"+v.slice(5) : v;
  $("aerr").textContent = "";
  if(v.length===8) lookupCep(v); else $("cephint").textContent = "";
});
FIELDS.forEach(i=>$(i).addEventListener("input", ()=>{ saveAddr(); update(); scheduleCalc(); }));
$("wa").addEventListener("click", e=>{
  const stop = (msg, field) => { e.preventDefault(); $("aerr").textContent = msg; if(field) $(field).focus(); };
  const cepOk = val("cep").replace(/\D/g,"").length===8;
  if(cepOk && val("cidade") && feeNow()===null) return stop("Entregamos apenas em São Roque.", "cep");
  const miss = !cepOk ? "cep" : ["rua","num","bairro","cidade"].find(i=>!val(i));
  if(miss) return stop("Preencha o endereço de entrega (CEP, rua, número, bairro e cidade).", miss);
  if(feeNow()===undefined) stop("Calculando a taxa de entrega… tente de novo em instantes.");
});
loadAddr(); scheduleCalc();

function drawCtl(id){
  const q = qtyOf(id), el = $("ctl-"+id);
  el.innerHTML = q
    ? `<button class="btn minus" data-act="sub" data-id="${id}" aria-label="Remover um">−</button><span class="qty">${q}</span><button class="btn" data-act="add" data-id="${id}" aria-label="Adicionar mais um">+</button>`
    : `<button class="btn" data-act="add" data-id="${id}" aria-label="Adicionar ${esc(flat[id].name)}">+</button>`;
}
function update(){
  const ids = Object.keys(cart);
  const n = ids.reduce((s,k)=>s+cart[k].qty,0);
  const fee = mode==="entrega" ? (feeNow()||0) : 0;
  const total = ids.reduce((s,k)=>s+cart[k].qty*flat[cart[k].id].price,0) + fee;
  $("bar").classList.toggle("on", n>0);
  $("total").textContent = money(total);
  $("count").textContent = n + (n===1?" item":" itens");
  const lines = ids.map(k=>`• ${cart[k].qty}x ${flat[cart[k].id].name}${cart[k].opts.length?" ("+cart[k].opts.join(", ")+")":""}`).join("\n");
  const disc = $("disc").getAttribute("aria-pressed")==="true";
  const obs = $("obs").value.trim();
  $("extras").hidden = n===0;
  showFee();
  const msg = `Olá! Quero fazer um pedido no Açaí & Cia:\n${lines}\n\nTotal: ${money(total)}\n\n${addrText()}\n\nDescartáveis: ${disc?"Sim":"Não"}${obs?"\nObservações: "+obs:""}`;
  $("wa").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
}
Object.keys(flat).forEach(drawCtl);
document.addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const id = b.dataset.id;
  if (b.dataset.act==="add" && flat[id].pick) { openPick(id); return; }
  if (b.dataset.act==="add") addLine(id, []); else removeOne(id);
  drawCtl(id); update();
  document.querySelector(`#ctl-${id} .btn:last-child`)?.focus();
});
function qtyOf(id){return Object.values(cart).filter(l=>l.id===id).reduce((s,l)=>s+l.qty,0)}
function addLine(id,opts){const k=id+"|"+[...opts].sort().join(",");(cart[k]=cart[k]||{id,qty:0,opts:[...opts]}).qty++}
function removeOne(id){const ks=Object.keys(cart).filter(k=>cart[k].id===id);const k=ks[ks.length-1];if(!k)return;if(--cart[k].qty<=0)delete cart[k]}
const modal = $("modal");
function openPick(id){
  pending = id;
  $("mt").textContent = flat[id].name;
  $("ms").textContent = "Escolha até "+flat[id].pick+" acompanhamentos grátis";
  $("mh").textContent = "";
  $("mo").innerHTML = FREE.map(f=>`<label class="opt"><input type="checkbox" value="${f}"> ${f}</label>`).join("");
  modal.hidden = false;
  modal.querySelector("input").focus();
}
function closePick(){modal.hidden = true; pending = null}
$("mo").addEventListener("change", e=>{
  const n = document.querySelectorAll("#mo input:checked").length, max = flat[pending].pick;
  if(n>max){e.target.checked = false; $("mh").textContent = "Máximo de "+max+". Desmarque um para trocar.";}
  else $("mh").textContent = "";
});
$("mok").onclick = ()=>{
  const id = pending, opts = [...document.querySelectorAll("#mo input:checked")].map(i=>i.value);
  addLine(id, opts); closePick(); drawCtl(id); update();
  document.querySelector(`#ctl-${id} .btn:last-child`)?.focus();
};
$("mc").onclick = closePick;
modal.addEventListener("click", e=>{if(e.target===modal) closePick()});
document.addEventListener("keydown", e=>{if(e.key==="Escape" && !modal.hidden) closePick()});
$("disc").onclick = e=>{const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")==="true"?"false":"true"); update()};
$("obs").addEventListener("input", update);

/* ---------- Menu: destaca a categoria visível ---------- */
(function(){
  const nav = $("chips"), links = [...nav.querySelectorAll("a")], secs = [...document.querySelectorAll("main section")];
  let cur = -1, ticking = false;
  function mark(i){
    if(i===cur) return; cur = i;
    links.forEach((a,j)=>{
      a.classList.toggle("on", i===j);
      i===j ? a.setAttribute("aria-current","true") : a.removeAttribute("aria-current");
    });
    const a = links[i];
    nav.scrollTo({left: a.offsetLeft - nav.clientWidth/2 + a.offsetWidth/2, behavior:"smooth"});
  }
  function onScroll(){
    ticking = false;
    const y = innerHeight*0.3; let i = 0;
    secs.forEach((s,j)=>{ if(s.getBoundingClientRect().top <= y) i = j; });
    mark(i);
  }
  addEventListener("scroll", ()=>{ if(!ticking){ ticking = true; requestAnimationFrame(onScroll); } }, {passive:true});
  addEventListener("resize", onScroll);
  onScroll();
})();
</script>
